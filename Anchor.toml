[toolchain]
package_manager = "yarn"
anchor_version = "0.32.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
tuktuk_counter = "DTk2fbtzc4JkfCXdYYwQNjyigCXwZtBrSPL8sDnmUGj9"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[test.validator]
url = "https://api.devnet.solana.com"
startup_wait = 10000

[[test.validator.clone]]
address = "tuktukUrfhXT6ZT77QTU8RQtvgL967uRuVagWF57zVA"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""
test-vault = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/vault-test.ts\""
cron = "yarn run ts-node cron/cron.ts --cronName tuktuk-counter-cron --queueName tuktuk-counter --walletPath ~/.config/solana/id.json --rpcUrl https://api.devnet.solana.com"
